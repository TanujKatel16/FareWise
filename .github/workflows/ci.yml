name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Formatting and server syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check server-side JavaScript syntax
        run: |
          for file in server.js config/*.js controllers/*.js routes/*.js services/*.js middlewares/*.js models/*.js scripts/*.cjs; do
            node --check "$file"
          done
